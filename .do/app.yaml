# The one deployment construction mode allows (AGENTS.md, "The static-site exception"): a free static site.
# No service, worker, job, database or function — scripts/check-construction.mjs refuses all of them.
name: yororis-dev
region: tor
static_sites:
  - name: site
    github:
      repo: krizaka/yororis
      branch: main
      deploy_on_push: true
    source_dir: site
    build_command: npm ci && npm run build
    output_dir: dist
    environment_slug: node-js
    catchall_document: index.html
    error_document: index.html
domains:
  - domain: dev.yororis.com
    type: PRIMARY
