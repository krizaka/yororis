# The one deployment construction mode allows (AGENTS.md, "The static-site exception"): a free static site.
# No service, worker, job, database or function — scripts/check-construction.mjs refuses all of them.
name: yororis-dev
region: tor
static_sites:
  - name: site
    github:
      repo: krizaka/yororis
      branch: main
      deploy_on_push: true
    source_dir: site
    build_command: npm ci && npm run build
    output_dir: out
    environment_slug: node-js
    error_document: 404.html
    # Dev is closed to search engines (noindex, robots Disallow /, no sitemap, the dev line in the footer); production flips it.
    envs:
      - key: APP_SEARCH_INDEXING
        scope: BUILD_TIME
        value: "off"
domains:
  - domain: dev.yororis.com
    type: PRIMARY
