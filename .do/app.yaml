# The one deployment construction mode allows (AGENTS.md, "The static-site exception"): a free static site.
# No service, worker, job, database or function — scripts/check-construction.mjs refuses all of them.
name: yororis-dev
region: tor
static_sites:
  - name: site
    github:
      repo: krizaka/yororis
      branch: main
      deploy_on_push: true
    source_dir: site
    build_command: npm ci && npm run build
    output_dir: out
    environment_slug: node-js
    error_document: 404.html
    # The build is the public one (www.yororis.com): indexed (krizaka-com AGENTS §2.4). dev.yororis.com serves nothing
    # but /.well-known (ingress below); every other page goes to www with a 308, so nothing of dev is indexed.
    envs:
      - key: APP_SEARCH_INDEXING
        scope: BUILD_TIME
        value: "on"
domains:
  - domain: www.yororis.com
    type: PRIMARY
  - domain: yororis.com
    type: ALIAS
  - domain: dev.yororis.com
    type: ALIAS
# The apex and dev lead to www (308); the rule order matters: first match wins.
ingress:
  rules:
    - match:
        authority:
          exact: yororis.com
      redirect:
        authority: www.yororis.com
        redirect_code: 308
    - match:
        authority:
          exact: dev.yororis.com
        path:
          prefix: /.well-known
      component:
        name: site
    - match:
        authority:
          exact: dev.yororis.com
      redirect:
        authority: www.yororis.com
        redirect_code: 308
    - match:
        path:
          prefix: /
      component:
        name: site
