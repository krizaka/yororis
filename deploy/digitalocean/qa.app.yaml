# Yororis app — DigitalOcean App Platform, project `yororis`, region tor. One service serves www.yororis.com: the public home (the static
# export of site/, inside the image) and the member space for invited testers only (docs/FRAMEWORK.md §5; AGENTS.md, « lawyers OK in
# principle, 2026-10-21, invited testers only »): sign-up closed, the lexicon enforced. The smallest service ($5/month; the static site
# app it replaces was free). Secrets are filled at apply time (`__NAME__`, never committed) and stored as SECRET.
name: yororis-qa
region: tor
alerts:
  - rule: DEPLOYMENT_FAILED
domains:
  - domain: www.yororis.com
    type: PRIMARY
  - domain: yororis.com
    type: ALIAS
  - domain: dev.yororis.com
    type: ALIAS
  - domain: qa.yororis.com
    type: ALIAS
# The apex, qa and dev lead to www (308), the path kept. dev serves only its API, its /.well-known and its robots.txt (noindex); the rule
# order matters: first match wins (`preserve_path_prefix`: the platform strips the matched prefix otherwise) (the family's www rule, krizaka/.github#119).
ingress:
  rules:
    - match: { authority: { exact: yororis.com } }
      redirect: { authority: www.yororis.com, redirect_code: 308 }
    - match: { authority: { exact: qa.yororis.com } }
      redirect: { authority: www.yororis.com, redirect_code: 308 }
    - match: { authority: { exact: dev.yororis.com }, path: { prefix: /api } }
      component: { name: web, preserve_path_prefix: true }
    - match: { authority: { exact: dev.yororis.com }, path: { prefix: /.well-known } }
      component: { name: web, preserve_path_prefix: true }
    - match: { authority: { exact: dev.yororis.com }, path: { prefix: /robots.txt } }
      component: { name: web, preserve_path_prefix: true }
    - match: { authority: { exact: dev.yororis.com } }
      redirect: { authority: www.yororis.com, redirect_code: 308 }
    - match: { path: { prefix: / } }
      component: { name: web }
services:
  - name: web
    dockerfile_path: deploy/docker/Dockerfile
    source_dir: /
    github:
      repo: krizaka/yororis
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/healthz
      initial_delay_seconds: 20
      period_seconds: 15
    envs:
      - { key: APP_COMMIT_SHA, scope: BUILD_TIME, value: "${_self.COMMIT_HASH}" }
      # The reference of the written decision that allows this start (FRAMEWORK §5; the private register, line of 2026-10-17).
      - { key: APP_RELEASE_APPROVAL, scope: RUN_TIME, value: "yororis-cadre-7-2026-10-21-invited-testers" }
      - { key: AUTH_SIGNUP_ENABLED, scope: RUN_TIME, value: "false" }
      - { key: AUTH_SESSION_SECRET, scope: RUN_TIME, type: SECRET, value: "__AUTH_SESSION_SECRET__" }
      # The invited testers' accounts (AGENTS.md, « lawyers OK in principle, 2026-10-21, invited testers only »): one database of the
      # shared cluster (no component of its own), its URL and CA as secrets. The cast's demo password is for local runs only.
      - { key: DATABASE_URL, scope: RUN_TIME, type: SECRET, value: "__DATABASE_URL__" }
      - { key: DATABASE_CA_CERT, scope: RUN_TIME, type: SECRET, value: "__DATABASE_CA_CERT__" }
      # The address links are built on (the e-mailed reset link): never read from a request header.
      - { key: APP_URL, scope: RUN_TIME, value: "https://www.yororis.com" }
      # E-mail through the family's Mailgun (one account, a Yororis from-address on its verified domain).
      - { key: MAIL_PROVIDER, scope: RUN_TIME, value: "mailgun" }
      - { key: MAIL_API_KEY, scope: RUN_TIME, type: SECRET, value: "__MAIL_API_KEY__" }
      - { key: MAIL_DOMAIN, scope: RUN_TIME, value: "mg.krizaka.com" }
      - { key: MAIL_FROM, scope: RUN_TIME, value: "Yororis <no-reply@mg.krizaka.com>" }
      # The moment's AI is Orazaka's wellbeing pack, through its edge and the service key of the Yororis account.
      - { key: AI_API_URL, scope: RUN_TIME, value: "https://dev.orazaka.com/edge" }
      - { key: AI_API_KEY, scope: RUN_TIME, type: SECRET, value: "__AI_API_KEY__" }
      - { key: APP_REGION, scope: RUN_TIME, value: "CA-QC" }
      # QA widens the presence that stops (the product's defaults are 25 minutes, 1 a day, 3 a week); the length stays 25.
      - { key: APP_MOMENT_MINUTES, scope: RUN_TIME, value: "25" }
      - { key: APP_MOMENTS_PER_DAY, scope: RUN_TIME, value: "20" }
      - { key: APP_MOMENTS_PER_WEEK, scope: RUN_TIME, value: "100" }
