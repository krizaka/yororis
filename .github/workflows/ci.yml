name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  construction:
    name: Construction mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-construction.mjs
      - run: node --test scripts/check-construction.test.mjs
  site:
    name: Static site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: SEO family contract (served from out/)
        run: |
          python3 -m http.server 3000 --directory out >/dev/null 2>&1 &
          sleep 2
          node scripts/check-seo-family.mjs --base http://localhost:3000 --host https://dev.yororis.com --types WebSite,SoftwareApplication
          # Responsive guard: no horizontal overflow at 360–1440 px in both themes; the crisis lines in the first 360 px screen.
          npx playwright-core install --with-deps chromium
          npm run check:overflow -- --base http://localhost:3000
      - name: Closed build (APP_SEARCH_INDEXING=off, the dev deployment)
        run: |
          APP_SEARCH_INDEXING=off npm run build
          npm run test:closed
  member-space:
    name: Member space (local only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      AUTH_SESSION_SECRET: ci-only-secret-0123456789abcdef0123456789
      AUTH_DEMO_PASSWORD: ci-only-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
